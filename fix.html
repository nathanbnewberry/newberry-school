<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fix the game</title>
<style>body{margin:0;padding:24px;background:#fbf3df;color:#1c1712;font:18px/1.45 -apple-system,system-ui,sans-serif}main{max-width:560px;margin:auto}h1{margin:0 0 8px}a.go{display:block;margin-top:18px;padding:18px;border-radius:12px;background:#2f7f4a;color:#fff;text-align:center;font-weight:800;text-decoration:none}li{margin:4px 0}.small{font-size:.85rem;color:#5d564b;word-break:break-word}</style></head>
<body><main><h1>Fixing the game</h1><p id="step">Working...</p><ul id="saves"></ul><a class="go" id="go" href="./" hidden>Open the game</a><p class="small" id="info"></p></main>
<script>
// Clears only the saved copy of the game's pages. Children's progress on this device is left alone.
(async function () {
  var step = document.getElementById("step"), list = document.getElementById("saves"), notes = [];
  try { var regs = await navigator.serviceWorker.getRegistrations(); for (var i = 0; i < regs.length; i++) await regs[i].unregister(); notes.push("workers " + regs.length); } catch (e) { notes.push("worker: " + e.message); }
  try { var keys = await caches.keys(); for (var j = 0; j < keys.length; j++) if (keys[j].indexOf("app-") === 0) await caches.delete(keys[j]); notes.push("caches " + keys.length); } catch (e) { notes.push("cache: " + e.message); }
  var kids = [["Elliot", "elliot-trail-v1"], ["Finley", "family-trail-finn"], ["Myla", "family-trail-myla"]], d = new Date();
  var today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  kids.forEach(function (k) {
    var s = null; try { s = JSON.parse(localStorage.getItem(k[1]) || "null"); } catch (e) {}
    var li = document.createElement("li"), day = s && s.days && s.days[today];
    li.textContent = k[0] + ": " + (s ? "$" + (s.nuggets || 0) + (day ? ", " + (day.spellWords || 0) + " spelling words today, " + Math.round((day.readSecs || 0) / 60) + " minutes reading" : ", nothing today") : "nothing saved on this device");
    list.appendChild(li);
  });
  var linked = false; try { linked = localStorage.getItem("family-linked") === "1"; } catch (e) {}
  notes.push(linked ? "signed in" : "not signed in");
  step.textContent = "All set. Progress on this device was not touched, and here's what's on it:";
  var go = document.getElementById("go"); go.href = "./?fresh=" + Date.now(); go.hidden = false;
  document.getElementById("info").textContent = notes.join(", ");
})();
</script></body></html>
