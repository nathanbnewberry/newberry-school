<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Elliot's Math Trail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout concept: an arcade game. A live game world runs across the top of the screen and the math happens on the console under it. */
:root{
  --night:#12142b; --panel:#1e2245; --panel2:#2b2f5e; --line:#454a86; --ember:#ff7a3c; --gold:#ffc42e; --gold-deep:#c98a0c;
  --green:#39d07a; --green-deep:#1f8f50; --red:#ff5a4f; --moon:#f2f3ff; --moon-soft:#b4b9e0; --paper:#fff4d8; --ink:#2c1a0e;
  --display:"Rye",Georgia,"Times New Roman",serif; --body:"Lexend","Trebuchet MS",Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--night);color:var(--moon);font:400 17px/1.45 var(--body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 40px;user-select:none;-webkit-user-select:none}
#shell{max-width:720px;margin:0 auto;display:grid;gap:12px}
#world{display:block;width:100%;border-radius:14px;background:#27295a;touch-action:manipulation}
#app{display:grid;gap:12px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.btn{background:var(--gold);color:var(--ink);font-weight:800;padding:14px 20px;min-height:56px;box-shadow:0 5px 0 var(--gold-deep);font-size:1.05rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--green);box-shadow:0 5px 0 var(--green-deep)}
.btn.dark{background:var(--panel2);color:var(--moon);box-shadow:0 5px 0 #15183a}
.btn.small{min-height:44px;padding:8px 14px;font-size:.92rem}
.wide{width:100%}
.link{color:var(--moon-soft);text-decoration:underline;padding:10px 8px;min-height:44px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.nug{color:var(--gold)}.nug i{width:16px;height:13px;background:var(--gold);border-radius:45% 55% 50% 40%;box-shadow:inset -3px -3px 0 var(--gold-deep);display:block}
.combo{color:var(--ember);font-family:var(--display);font-size:1.15rem}
.pips{display:flex;gap:6px}.pips b{width:26px;height:10px;border-radius:5px;background:var(--panel2);display:block}.pips b.on{background:var(--green)}.pips b.now{background:var(--gold)}
.rank{display:grid;gap:4px;min-width:150px;flex:1}.rank span{font-family:var(--display);font-size:1.1rem}
.xp{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold))}

.biscuit{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:600;min-height:66px}
.biscuit svg{width:50px;height:50px;color:#8a5a2b;display:block}
.biscuit .mic{font-size:.8rem;font-weight:800;color:var(--ink);padding:8px;min-height:44px;text-decoration:underline}
.console{background:var(--panel);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.tag{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--moon-soft);text-align:center}
.prompt{font-size:clamp(1.15rem,4.4vw,1.55rem);font-weight:600;text-align:center;line-height:1.3}
.prompt.math{font-size:clamp(2rem,9vw,3rem);font-weight:800;font-variant-numeric:tabular-nums}
.ctx{background:var(--panel2);border-radius:10px;padding:10px 12px;font-weight:600;text-align:center}
.answer{display:flex;align-items:center;justify-content:center;min-height:62px;border:3px solid var(--line);border-radius:10px;background:var(--night);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-x:auto;color:var(--gold)}
.answer .empty{color:var(--moon-soft);font-weight:400;font-size:1rem}
.answer.mini{min-height:48px;font-size:1.5rem}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pad button{background:var(--panel2);color:var(--moon);font-weight:800;font-size:1.4rem;min-height:56px;box-shadow:0 4px 0 #15183a;font-variant-numeric:tabular-nums}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #15183a;background:var(--line)}
.pad.pin{grid-template-columns:repeat(3,minmax(0,1fr));max-width:280px;margin:0 auto;width:100%}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices button{background:var(--panel2);box-shadow:0 4px 0 #15183a;padding:12px;font-weight:700;min-height:58px;font-size:1.05rem}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 #15183a}
.choices.big button{font-size:1.7rem;font-weight:800;min-height:84px}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sort .yes{background:var(--green);color:var(--ink);box-shadow:0 5px 0 var(--green-deep)}.sort .no{background:#9a8f7b;color:var(--ink);box-shadow:0 5px 0 #5f5748}
.sort button{font-weight:800;font-size:1.3rem;min-height:72px}
.card{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:clamp(1.4rem,6vw,2rem);text-align:center;padding:20px 12px;border-radius:10px}
.shake{animation:shake .32s}@keyframes shake{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.75);opacity:.2}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

.board{display:inline-grid;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:800;font-variant-numeric:tabular-nums;grid-auto-rows:1.4em;justify-items:center;align-items:center}
.boardwrap{text-align:center;overflow-x:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px}
.bc{width:1.05em;height:1.3em;display:flex;align-items:center;justify-content:center;border-radius:5px;position:relative}
.bc.small{font-size:.62em;color:#b4411a}
.bc.bar::before{content:"";position:absolute;top:0;left:-1px;right:-1px;border-top:3px solid var(--ink)}
.bc.hot{background:#ffd76a}
.bc.target{background:var(--green);outline:2px dashed var(--green-deep)}
.bc.typed{color:#17663a}
.brule{grid-column:1/-1;height:3px;background:var(--ink);width:100%}

.vis{text-align:center;overflow-x:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;min-width:0}
.vis button{background:var(--green);color:var(--ink);font-weight:800;padding:10px 16px;min-height:46px;margin-top:8px;box-shadow:0 4px 0 var(--green-deep)}
.nets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.net{border:3px solid var(--ink);border-radius:8px;padding:5px;display:grid;grid-template-columns:repeat(4,18px);gap:2px;min-height:48px;min-width:96px;align-content:start}
.net svg{width:18px;height:18px;display:block}
.gridv{display:inline-grid;gap:2px}.gridv i{width:34px;height:34px;background:#7ec77e;border:2px solid #2d6b2d;display:block}
.cal{display:inline-grid;grid-template-columns:repeat(7,2em);gap:2px;font-weight:700;font-variant-numeric:tabular-nums}.cal b{background:var(--ink);color:var(--paper);border-radius:3px}.cal span{padding:2px 0}.calt{font-family:var(--display);margin-bottom:4px}

.towns{display:grid;gap:10px}
.town{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:12px;width:100%;text-align:left;color:var(--moon);min-height:70px;font-weight:400}
.town .n{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--display)}
.town.done .n{background:var(--green);color:var(--ink)}.town.next{outline:3px solid var(--gold)}.town.next .n{background:var(--gold);color:var(--ink)}
.town.lock{opacity:.5;cursor:not-allowed}
.town h3{font-size:1.2rem}
.sub{font-size:.9rem;color:var(--moon-soft)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.game{background:var(--panel2);border-radius:12px;padding:14px;text-align:left;display:grid;gap:4px;box-shadow:0 5px 0 #15183a;min-height:96px}
.game h3{font-size:1.25rem;color:var(--gold)}
.big{font-family:var(--display);font-size:clamp(2.2rem,10vw,3.6rem);text-align:center;color:var(--gold);text-shadow:0 4px 0 #7a4f06;line-height:1.05}
.center{text-align:center}
.scene{border-radius:10px;overflow:hidden;background:var(--green-deep)}.scene svg{display:block;width:100%;height:auto}
.call{text-align:center;font-family:var(--display);font-size:1.6rem;min-height:2.2rem;color:var(--gold)}
.score{display:flex;gap:8px;justify-content:center}.score i{width:20px;height:20px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:block}.score i.g{background:var(--green)}.score i.m{background:var(--red)}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.fx i{position:absolute;top:30%;width:10px;height:14px;border-radius:2px;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:21;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:1.6rem;padding:12px 22px;border-radius:12px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}

.shop{display:grid;gap:10px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 14px}.item b{display:block}
.panel{background:var(--panel);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;user-select:text;-webkit-user-select:text}.panel h2{font-size:1.3rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--moon-soft)}
.tablewrap{overflow-x:auto}.state{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap;color:var(--ink)}
.s-good{background:#a6ecc0}.s-work{background:#ffe2a8}.s-stuck{background:#ffb9a8}.s-none{background:var(--line);color:var(--moon)}
textarea{width:100%;min-height:130px;background:var(--night);color:var(--moon);border:1px solid var(--line);border-radius:8px;padding:10px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace}
ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.mini{padding:6px 10px;min-height:38px;font-size:.84rem;font-weight:700;background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <symbol id="ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff" stroke="#222" stroke-width="1.500"/><path fill="#222" d="m12 7.500 4.300 3.100-1.600 5h-5.400l-1.600-5zM12 1.300l-3 2.300 3 2 3-2zM22.500 10.500l-3.500-1.300-1 3.600 3 2.200zM1.500 10.500l3.500-1.300 1 3.600-3 2.200zM6.800 20.500l1.800-3.300h6.800l1.800 3.300-3.300 2h-3.800z"/></symbol>

<div id="shell">
  <canvas id="world" aria-label="Game world: Elliot riding after an outlaw"></canvas>
  <div id="app"></div>
</div>
<div class="fx" id="fx"></div>
<script src="lessons.js"></script>
<script>
const LESSONS = window.LESSONS || [];
const KEY = "elliot-trail-v1";
const DOC_PATH = "progress/elliot";

// Keep hash() and norm() identical to the copies in tools/build-lessons.mjs.
function hash(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const norm = (s) => String(s).toLowerCase().replace(/[^0-9a-z/.:]/g, "");
const seal = (lessonId, itemId, value) => hash(`${lessonId}|${itemId}|${norm(value)}`);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const app = document.getElementById("app");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- saved progress ---------- */
const blank = () => ({ nuggets: 0, xp: 0, owned: [], worn: {}, lessons: {}, goals: 0, wins: 0, runBest: 0, muted: false, voice: true, pin: null, updatedAt: 0 });
let S = blank();
try { S = { ...blank(), ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
let dbDoc = null, cloud = "device", saveTimer = 0;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!dbDoc) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { dbDoc.set(JSON.parse(JSON.stringify(S))).then(() => { cloud = "synced"; }).catch(() => { cloud = "device"; }); }, 1200);
}
async function connect() {
  const db = await (window.claude?.use?.("db") ?? Promise.resolve(null)).catch(() => null);
  if (!db) return;
  dbDoc = db.doc(DOC_PATH);
  await pull();
}
async function pull() {
  if (!dbDoc) return;
  try {
    const snap = await dbDoc.get();
    cloud = "synced";
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updatedAt || 0) > S.updatedAt) {
      S = { ...blank(), ...remote };
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if (U.view === "home" || U.view === "parent") render();
    }
  } catch (e) { cloud = "device"; }
}
// Saves from older versions can be missing fields, so fill them in place.
const LP = (id) => {
  const lp = (S.lessons[id] = S.lessons[id] || {});
  lp.completed = !!lp.completed; lp.problems = lp.problems || {}; lp.rides = lp.rides || {}; lp.drawBest = lp.drawBest ?? null;
  return lp;
};
const PP = (lp, id) => {
  const p = (lp.problems[id] = lp.problems[id] || {});
  p.done = !!p.done; p.firstTry = !!p.firstTry; p.wrong = p.wrong || []; p.coached = !!p.coached; p.steps = p.steps || 0; p.flagged = !!p.flagged; p.accepted = !!p.accepted;
  return p;
};

/* ---------- ranks ---------- */
const RANKS = [["Greenhorn", 0], ["Trail Hand", 300], ["Deputy", 800], ["Sheriff", 1600], ["Marshal", 3000], ["Legend of the West", 5000]];
const rankOf = (xp) => { let i = 0; RANKS.forEach((r, n) => { if (xp >= r[1]) i = n; }); return i; };
function earn(n) {
  const before = rankOf(S.xp);
  S.nuggets += n; S.xp += n;
  const after = rankOf(S.xp);
  if (after > before) { banner(`Rank up: ${RANKS[after][0]}!`); confetti(40); beep(FANFARE); }
}
function rankHud() {
  const i = rankOf(S.xp), next = RANKS[i + 1], from = RANKS[i][1];
  const pct = next ? Math.round(((S.xp - from) / (next[1] - from)) * 100) : 100;
  return `<div class="rank"><span>${RANKS[i][0]}</span><div class="xp" aria-label="${pct} percent to next rank"><i style="width:${pct}%"></i></div></div>`;
}

/* ---------- sound and voice ---------- */
let ac = null, music = 0;
function beep(notes) {
  if (S.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, at, len, type]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square"; o.frequency.value = f;
      g.gain.setValueAtTime(.07, ac.currentTime + at);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + at + len);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + at); o.stop(ac.currentTime + at + len);
    });
  } catch (e) {}
}
const CHIME = [[523, 0, .09], [659, .08, .09], [784, .16, .18]], BLIP = [[880, 0, .07]], NOPE = [[170, 0, .16, "sawtooth"]], THUD = [[100, 0, .15, "triangle"]], BANG = [[80, 0, .25, "sawtooth"], [50, .04, .3, "sawtooth"]];
const FANFARE = [[523, 0, .12], [523, .12, .08], [523, .2, .08], [784, .28, .3], [659, .5, .12], [784, .62, .5]];
function startMusic() {
  stopMusic();
  const bass = [147, 147, 220, 147, 196, 147, 175, 165]; let i = 0;
  music = setInterval(() => { beep([[bass[i % 8], 0, .14, "triangle"], ...(i % 2 ? [[bass[i % 8] * 3, 0, .05]] : [])]); i++; }, 210);
}
function stopMusic() { clearInterval(music); music = 0; }
let lastSaid = "";
function speak(t) {
  if (!t || t === lastSaid) return;
  lastSaid = t;
  try {
    if (S.voice === false || S.muted || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/×/g, " times ").replace(/÷/g, " divided by ").replace(/−/g, " minus ").replace(/√/g, " the square root of "));
    u.rate = 1.05; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function confetti(n = 24) {
  if (reduced) return;
  const fx = document.getElementById("fx"), cols = ["#ffc42e", "#ff7a3c", "#39d07a", "#f2f3ff", "#ff5a4f"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("i");
    el.style.left = "50%"; el.style.background = pick(cols);
    el.style.setProperty("--dx", `${(Math.random() - .5) * 700}px`); el.style.setProperty("--dy", `${Math.random() * 500 - 100}px`);
    fx.appendChild(el); setTimeout(() => el.remove(), 1000);
  }
}
function banner(t) { const b = document.createElement("div"); b.className = "banner pop"; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 2200); }

/* ---------- the game world ---------- */
const canvas = document.getElementById("world"), ctx = canvas.getContext("2d");
const W = { t: 0, scroll: 0, speed: 3, boost: 0, gap: .8, targetGap: .8, theme: "west", H: 200, shake: 0, dust: [], text: "", textT: 0, run: null, title: false, jump: 0 };
function worldSize(h) {
  W.H = h;
  const cssW = canvas.clientWidth || 720, dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.style.aspectRatio = `720 / ${h}`;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round((cssW * h / 720) * dpr);
}
addEventListener("resize", () => worldSize(W.H));
function worldBoost(msg) { W.boost = 50; W.shake = 8; if (msg) { W.text = msg; W.textT = 55; } for (let i = 0; i < 14; i++) W.dust.push({ x: 130, y: W.H - 28, vx: -2 - Math.random() * 5, vy: -Math.random() * 3, a: 1 }); }
function drawSky() {
  const H = W.H, c = ctx;
  if (W.theme === "pitch") {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#141a44"); g.addColorStop(.55, "#2a3a7a"); g.addColorStop(.56, "#2f9f5c"); g.addColorStop(1, "#1f7d45");
    c.fillStyle = g; c.fillRect(0, 0, 720, H);

      if (btn) btn.disabled = false; if (call) call.textContent = `Shot ${kick.shots.length + 1} of ${kick.n}`;
      kick.phase = "aim";
    }, reduced ? 400 : 900);
  }, 16);
}
function finishKick() { clearInterval(kickTimer); const g = kick.shots.filter(Boolean).length; U.gameEnd = { title: g === kick.n ? "Hat trick and then some!" : `${g} goals`, line: `${g} of ${kick.n} in the net. +${g * 8} nuggets.` }; U.view = "gameEnd"; render(); }
function duelRound() {
  const call = document.getElementById("duelCall"); if (!call) return;
  duel.state = "wait"; call.textContent = "Wait..."; call.style.color = "";
  clearTimeout(duel.timer);
  duel.timer = setTimeout(() => {
    if (!document.getElementById("duelCall")) return;
    duel.state = "draw"; duel.at = performance.now(); call.textContent = "DRAW!"; call.style.color = "var(--red)"; beep(BLIP);
    duel.limit = 520 + Math.random() * 260;
    duel.timer = setTimeout(() => { if (duel.state === "draw") duelResult(false, "Too slow. He got you."); }, duel.limit);
  }, reduced ? 900 : 900 + Math.random() * 2400);
}
function duelResult(win, line) {
  duel.state = "done"; clearTimeout(duel.timer);
  duel.shots.push(win); drawScore("dscore", duel.shots, duel.n);
  const sub = document.getElementById("duelSub"), call = document.getElementById("duelCall");
  if (sub) sub.textContent = line; if (call) { call.textContent = win ? "BANG!" : "Missed"; call.style.color = ""; }
  if (win) { S.wins++; earn(8); beep(BANG); confetti(14); W.shake = 10; save(); } else beep(NOPE);
  setTimeout(() => {
    if (!document.getElementById("duelCall")) return;
    if (duel.shots.length >= duel.n) { const w = duel.shots.filter(Boolean).length; U.gameEnd = { title: w === duel.n ? "Fastest in the West!" : `${w} outlaws down`, line: `You won ${w} of ${duel.n} duels. +${w * 8} nuggets.` }; U.view = "gameEnd"; render(); return; }
    duelRound();
  }, 1200);
}

/* ---------- actions ---------- */
function correctFx(msg) { U.combo++; worldBoost(msg); beep(CHIME); }
function wrongFx() { U.combo = 0; W.shake = 6; beep(NOPE); }
function curQ() { const it = U.items[U.i]; return it?.type === "problem" ? qOf(curLesson(), it.id) : null; }
function startCoach() {
  const q = curQ(), p = PP(LP(U.lesson), q.id);
  if (!q.coach) return;
  p.coached = true; U.mode = "coach"; U.step = 0; U.stepWrong = 0; U.draft = ""; U.msg = null; save(); render();
}
function applyStepRight(val) {
  const q = curQ(), c = q.coach, s = c.steps[U.step], p = PP(LP(U.lesson), q.id);
  if (s.put) { const ds = String(val).split("").reverse(); s.put.forEach((id, i) => { if (ds[i] !== undefined) U.fills[`${s.board || 0}:${id}`] = ds[i]; }); }
  p.steps++; earn(1); correctFx(); U.draft = ""; U.msg = null; U.stepWrong = 0; U.step++;
  if (U.step >= c.steps.length) { U.mode = "try"; U.coachDone = true; U.step = c.steps.length - 1; U.wrongNow = 0; }
  save(); render();
}
function stepWrong() { const s = curQ().coach.steps[U.step]; U.stepWrong++; U.msg = `${pick(["Not quite.", "Nope, close.", "Try again."])} ${s.nudge}`; U.draft = ""; wrongFx(); render(); }
function checkStepTyped() {
  const q = curQ(), s = q.coach.steps[U.step];
  if (seal(U.lesson, `${q.id}.${U.step}`, U.draft) === s.sealed) applyStepRight(U.draft); else stepWrong();
}
function checkFinal() {
  const q = curQ(); if (!q || U.solved) return;
  const l = curLesson(), p = PP(LP(l.id), q.id), val = norm(U.draft);
  if (!val) { U.msg = "Type your answer first, boss."; return render(); }
  const sealed = seal(l.id, q.id, val);
  if (q.sealed.includes(sealed)) {
    if (!p.done) { const fixed = p.wrong.length > 0; p.done = true; p.flagged = false; p.firstTry = !fixed && !p.coached; U.earned = 15 + (fixed ? 5 : 0) + (p.firstTry ? 5 : 0) + Math.min(U.combo, 10); earn(U.earned); U.solvedRun++; } else U.earned = 0;
    U.solved = true; U.msg = null; correctFx(pick(["BOOM!", "BULLSEYE!", "SIUUU!", "TOO EASY!"])); confetti(30); save(); return render();
  }
  if (!p.done && !p.wrong.includes(U.draft)) p.wrong.push(U.draft);
  U.wrongNow++; wrongFx();
  U.msg = q.traps[sealed] || pick(["Not it. Check your paper one step at a time.", "Missed the target. Go again."]);
  U.draft = ""; save();
  if (U.wrongNow >= 2 && !U.coachDone && q.coach) { U.msg = null; return startCoach(); }
  render();
}
function pressKey(k) {
  if (U.solved) return;
  if (k === "DEL") U.draft = U.draft.slice(0, -1);
  else if (U.draft.length < 20) U.draft += k;
  const q = curQ();
  if (q && U.mode === "coach" && k !== "DEL") {
    const s = q.coach.steps[U.step];
    if (s.len && U.draft.length >= s.len) return checkStepTyped();
  }
  const box = document.getElementById("ans");
  if (box) box.innerHTML = U.draft ? esc(U.draft) : `<span class="empty">Your answer</span>`;
  beep([[520, 0, .03]]);
}
const acts = {
  start() { U.view = "home"; W.title = false; worldBoost(); beep(FANFARE); render(); },
  view(d) { stopMusic(); U.view = d.v; U.pin = ""; U.pinMsg = ""; render(); window.scrollTo(0, 0); if (d.v === "parent") pull(); },
  leaveParent() { U.parentOk = false; U.view = "home"; U.confirmReset = false; U.pin = ""; render(); },
  mute() { S.muted = !S.muted; if (S.muted) { stopMusic(); try { speechSynthesis.cancel(); } catch (e) {} } save(); render(); },
  voice() { S.voice = S.voice === false; if (S.voice === false) { try { speechSynthesis.cancel(); } catch (e) {} } save(); render(); },
  town(d) { U.lesson = d.id; U.view = "town"; W.theme = "west"; render(); window.scrollTo(0, 0); },
  ride(d) { const l = curLesson(); startRide(l, rideOf(l, d.id)); },
  leaveRide() { U.view = "town"; U.combo = 0; save(); render(); },
  noteDone() { nextItem(); },
  fact(d, el) {
    const it = U.items[U.i], l = curLesson();
    if (seal(l.id, `w${it.i}`, d.c) !== it.w.sealed) { wrongFx(); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return; }
    earn(2); correctFx(pick(["BANG!", "POW!", "HIT!"])); U.solvedRun = Math.min(U.solvedRun + 1, 5); nextItem();
  },
  sort(d) {
    const it = U.items[U.i];
    if ((d.c === "1") === it.clue) { earn(2); correctFx(it.clue ? "CLUE!" : "DUST!"); nextItem(); }
    else { U.msg = it.why; wrongFx(); render(); }
  },
  learnPick(d) {
    const it = U.items[U.i];
    if (d.c === it.answer) { earn(2); correctFx(); nextItem(); }
    else { U.msg = it.nudge; wrongFx(); render(); }
  },
  mow() { U.mow++; W.shake = 2; beep(THUD); render(); },
  deal(d) { U.deal = Math.min(+d.t, U.deal + +d.g); beep(BLIP); render(); },
  key(d) { pressKey(d.k); },
  check: checkFinal,
  coach: startCoach,
  stepPick(d) {
    const q = curQ(), s = q.coach.steps[U.step];
    if (hash(`${U.lesson}|${q.id}.${U.step}|pick|${d.c}`) === s.sealed) applyStepRight(d.c); else stepWrong();
  },
  finalPick(d) { U.draft = d.c; checkFinal(); },
  paper() {
    const q = curQ(), p = PP(LP(U.lesson), q.id);
    if (!p.done) { p.done = true; p.paper = true; p.flagged = false; earn(15); U.solvedRun++; }
    correctFx("NICE DRAW!"); save(); nextItem();
  },
  flag() { const q = curQ(); PP(LP(U.lesson), q.id).flagged = true; U.combo = 0; save(); nextItem(); },
  next() { nextItem(); },
  game(d) {
    U.game = { kind: d.g, n: +d.n }; U.view = "game";
    if (d.g === "run") startRun(+d.n);
    render(); window.scrollTo(0, 0);
    if (d.g === "kick") startKick();
    if (d.g === "duel") { duel = { shots: [], n: Math.min(+d.n, 5), state: "wait" }; drawScore("dscore", duel.shots, duel.n); duelRound(); }
  },
  skipGame() { U.gameEnd = { title: "Back in the saddle", line: "Your boosts are safe with Biscuit. He ate two." }; U.view = "gameEnd"; render(); },
  jump: runJump, dash: runDash, shoot,
  fire() {
    if (!duel) return;
    if (duel.state === "wait") { clearTimeout(duel.timer); duelResult(false, "You fired early!"); }
    else if (duel.state === "draw") duelResult(true, `${Math.round(performance.now() - duel.at)} milliseconds!`);
  },
  backTown() { const l = curLesson(), nx = nextRide(l); if (nx && !(nx.after && !LP(l.id).rides[nx.after])) startRide(l, nx); else { U.view = "town"; render(); } },
  reward() { const l = curLesson(), lp = LP(l.id); if (!lp.completed) { lp.completed = true; earn(100); save(); } U.view = "reward"; beep(FANFARE); confetti(60); render(); },
  buy(d) { const g = GEAR.find((x) => x.id === d.id); if (S.nuggets >= g.cost && !S.owned.includes(g.id)) { S.nuggets -= g.cost; S.owned.push(g.id); S.worn[g.id] = true; beep(CHIME); save(); render(); } },
  wear(d) { S.worn[d.id] = !S.worn[d.id]; save(); render(); },
  pin(d) {
    if (d.k === "CLR") U.pin = "";
    else if (d.k === "OK") {
      if (U.pin.length !== 4) U.pinMsg = "A PIN has 4 digits.";
      else if (!S.pin) { S.pin = hash("pin|" + U.pin); U.parentOk = true; U.pinMsg = ""; save(); }
      else if (S.pin === hash("pin|" + U.pin)) { U.parentOk = true; U.pinMsg = ""; }
      else U.pinMsg = "That PIN doesn't match.";
      U.pin = "";
    } else if (U.pin.length < 4) U.pin += d.k;
    render();
  },
  accept(d) { const p = PP(LP(d.l), d.id); p.done = true; p.accepted = true; p.flagged = false; earn(15); save(); render(); },
  copy() {
    const t = document.getElementById("report");
    const done = () => { U.copied = true; render(); };
    if (navigator.clipboard) navigator.clipboard.writeText(reportText()).then(done, () => { t.focus(); t.select(); });
    else { t.focus(); t.select(); }
  },
  resetAsk() { U.confirmReset = true; render(); },
  resetNo() { U.confirmReset = false; render(); },
  resetYes() { const pin = S.pin; S = { ...blank(), pin }; U.confirmReset = false; save(); render(); }
};
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && acts[el.dataset.act]) acts[el.dataset.act](el.dataset, el);
});
canvas.addEventListener("pointerdown", () => { if (W.run) runJump(); });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (W.run) { if (e.key === " " || e.key === "ArrowUp") { runJump(); e.preventDefault(); } else if (e.key === "d" || e.key === "ArrowRight") runDash(); return; }
  if (U.view !== "ride") return;
  const q = curQ();
  if (!q || U.solved) return;
  if (U.mode === "coach" ? q.coach.steps[U.step].choices : q.choices || q.paper) return;
  if (/^[0-9/.:,]$/.test(e.key)) pressKey(e.key);
  else if (e.key === "r" || e.key === "R") pressKey("R");
  else if (e.key === "Backspace") { pressKey("DEL"); e.preventDefault(); }
  else if (e.key === "Enter" && U.mode !== "coach" && e.target.tagName !== "BUTTON") checkFinal();
});

/* ---------- draw ---------- */
function render() {
  clearInterval(kickTimer);
  if ((U.view === "ride" || U.view === "town" || U.view === "rideEnd" || U.view === "game" || U.view === "gameEnd" || U.view === "reward") && !curLesson()) U.view = "home";
  W.title = U.view === "title" || U.view === "home";
  canvas.hidden = U.view === "parent";
  const views = { title: titleView, home: homeView, town: townView, ride: rideView, rideEnd: rideEndView, game: gameView, gameEnd: gameEndView, reward: rewardView, store: storeView, parent: parentView };
  try { app.innerHTML = views[U.view](); }
  catch (e) { app.innerHTML = `<div class="console center"><h2>Biscuit tripped.</h2><p>Something went wrong on this screen. Your progress is saved.</p><p class="sub">${esc(e.message)}</p><button class="btn go wide" data-act="view" data-v="home">Back to the map</button></div>`; }
}
worldSize(200);
render();
connect();
</script>
