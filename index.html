<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="cache-control" content="no-cache"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Elliot's Math Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Schoolbell&family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout concept: an arcade game. A live game world runs across the top of the screen and the math happens on the console under it. */
:root{
  --night:#12142b; --panel:#1e2245; --panel2:#2b2f5e; --line:#454a86; --ember:#ff7a3c; --gold:#ffc42e; --gold-deep:#c98a0c;
  --green:#39d07a; --green-deep:#1f8f50; --red:#ff5a4f; --moon:#f2f3ff; --moon-soft:#b4b9e0; --paper:#fff4d8; --ink:#2c1a0e;
  --display:"Rye",Georgia,"Times New Roman",serif; --body:"Lexend","Trebuchet MS",Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--night);color:var(--moon);font:400 17px/1.45 var(--body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 40px;user-select:none;-webkit-user-select:none}
#shell{max-width:720px;margin:0 auto;display:grid;gap:12px}
#world{display:block;width:100%;border-radius:14px;background:#27295a;touch-action:manipulation}
#app{display:grid;gap:12px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
.btn{background:var(--gold);color:var(--ink);font-weight:800;padding:14px 20px;min-height:56px;box-shadow:0 5px 0 var(--gold-deep);font-size:1.05rem}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--green);box-shadow:0 5px 0 var(--green-deep)}
.btn.dark{background:var(--panel2);color:var(--moon);box-shadow:0 5px 0 #15183a}
.btn.small{min-height:44px;padding:8px 14px;font-size:.92rem}
.wide{width:100%}
.link{color:var(--moon-soft);text-decoration:underline;padding:10px 8px;min-height:44px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.nug{color:var(--gold)}.nug i{width:16px;height:13px;background:var(--gold);border-radius:45% 55% 50% 40%;box-shadow:inset -3px -3px 0 var(--gold-deep);display:block}
.combo{color:var(--ember);font-family:var(--display);font-size:1.15rem}
.pips{display:flex;gap:6px}.pips b{width:26px;height:10px;border-radius:5px;background:var(--panel2);display:block}.pips b.on{background:var(--green)}.pips b.now{background:var(--gold)}
.rank{display:grid;gap:4px;min-width:150px;flex:1}.rank span{font-family:var(--display);font-size:1.1rem}
.xp{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold))}

.biscuit{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:600;min-height:66px}
.biscuit svg{width:50px;height:50px;color:#8a5a2b;display:block}
.biscuit .mic{font-size:.8rem;font-weight:800;color:var(--ink);padding:8px;min-height:44px;text-decoration:underline}
.console{background:var(--panel);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.tag{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--moon-soft);text-align:center}
.prompt{font-size:clamp(1.15rem,4.4vw,1.55rem);font-weight:600;text-align:center;line-height:1.3}
.prompt.math{font-size:clamp(2rem,9vw,3rem);font-weight:800;font-variant-numeric:tabular-nums}
.ctx{background:var(--panel2);border-radius:10px;padding:10px 12px;font-weight:600;text-align:center}
.answer{display:flex;align-items:center;justify-content:center;min-height:62px;border:3px solid var(--line);border-radius:10px;background:var(--night);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-x:auto;color:var(--gold)}
.answer .empty{color:var(--moon-soft);font-weight:400;font-size:1rem}
.answer.mini{min-height:48px;font-size:1.5rem}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pad button{background:var(--panel2);color:var(--moon);font-weight:800;font-size:1.4rem;min-height:56px;box-shadow:0 4px 0 #15183a;font-variant-numeric:tabular-nums}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #15183a;background:var(--line)}
.pad.pin{grid-template-columns:repeat(3,minmax(0,1fr));max-width:280px;margin:0 auto;width:100%}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices button{background:var(--panel2);box-shadow:0 4px 0 #15183a;padding:12px;font-weight:700;min-height:58px;font-size:1.05rem}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 #15183a}
.choices.big button{font-size:1.7rem;font-weight:800;min-height:84px}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sort .yes{background:var(--green);color:var(--ink);box-shadow:0 5px 0 var(--green-deep)}.sort .no{background:#9a8f7b;color:var(--ink);box-shadow:0 5px 0 #5f5748}
.sort button{font-weight:800;font-size:1.3rem;min-height:72px}
.card{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:clamp(1.4rem,6vw,2rem);text-align:center;padding:20px 12px;border-radius:10px}
.shake{animation:shake .32s}@keyframes shake{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.75);opacity:.2}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

.board{display:inline-grid;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:800;font-variant-numeric:tabular-nums;grid-auto-rows:1.4em;justify-items:center;align-items:center}
.boardwrap{text-align:center;overflow-x:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px}
.bc{width:1.05em;height:1.3em;display:flex;align-items:center;justify-content:center;border-radius:5px;position:relative}
.bc.small{font-size:.62em;color:#b4411a}
.bc.bar::before{content:"";position:absolute;top:0;left:-1px;right:-1px;border-top:3px solid var(--ink)}
.bc.hot{background:#ffd76a}
.bc.target{background:var(--green);outline:2px dashed var(--green-deep)}
.bc.typed{color:#17663a}
.brule{grid-column:1/-1;height:3px;background:var(--ink);width:100%}

.vis{text-align:center;overflow-x:auto;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;min-width:0}
.vis button{background:var(--green);color:var(--ink);font-weight:800;padding:10px 16px;min-height:46px;margin-top:8px;box-shadow:0 4px 0 var(--green-deep)}
.nets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.net{border:3px solid var(--ink);border-radius:8px;padding:5px;display:grid;grid-template-columns:repeat(4,18px);gap:2px;min-height:48px;min-width:96px;align-content:start}
.net svg{width:18px;height:18px;display:block}
.gridv{display:inline-grid;gap:2px}.gridv i{width:34px;height:34px;background:#7ec77e;border:2px solid #2d6b2d;display:block}
.cal{display:inline-grid;grid-template-columns:repeat(7,2em);gap:2px;font-weight:700;font-variant-numeric:tabular-nums}.cal b{background:var(--ink);color:var(--paper);border-radius:3px}.cal span{padding:2px 0}.calt{font-family:var(--display);margin-bottom:4px}

.towns{display:grid;gap:10px}
.town{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:12px;width:100%;text-align:left;color:var(--moon);min-height:70px;font-weight:400}
.town .n{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--display)}
.town.done .n{background:var(--green);color:var(--ink)}.town.next{outline:3px solid var(--gold)}.town.next .n{background:var(--gold);color:var(--ink)}
.town.lock{opacity:.5;cursor:not-allowed}
.town h3{font-size:1.2rem}
.sub{font-size:.9rem;color:var(--moon-soft)}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.game{background:var(--panel2);border-radius:12px;padding:14px;text-align:left;display:grid;gap:4px;box-shadow:0 5px 0 #15183a;min-height:96px}
.game h3{font-size:1.25rem;color:var(--gold)}
.big{font-family:var(--display);font-size:clamp(2.2rem,10vw,3.6rem);text-align:center;color:var(--gold);text-shadow:0 4px 0 #7a4f06;line-height:1.05}
.center{text-align:center}
.scene{border-radius:10px;overflow:hidden;background:var(--green-deep)}.scene svg{display:block;width:100%;height:auto}
.call{text-align:center;font-family:var(--display);font-size:1.6rem;min-height:2.2rem;color:var(--gold)}
.score{display:flex;gap:8px;justify-content:center}.score i{width:20px;height:20px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:block}.score i.g{background:var(--green)}.score i.m{background:var(--red)}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.fx i{position:absolute;top:30%;width:10px;height:14px;border-radius:2px;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:21;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:1.6rem;padding:12px 22px;border-radius:12px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}

.shop{display:grid;gap:10px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 14px}.item b{display:block}
.panel{background:var(--panel);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;user-select:text;-webkit-user-select:text}.panel h2{font-size:1.3rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--moon-soft)}
.tablewrap{overflow-x:auto}.state{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap;color:var(--ink)}
.s-good{background:#a6ecc0}.s-work{background:#ffe2a8}.s-stuck{background:#ffb9a8}.s-none{background:var(--line);color:var(--moon)}
textarea{width:100%;min-height:130px;background:var(--night);color:var(--moon);border:1px solid var(--line);border-radius:8px;padding:10px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace}
ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.mini{padding:6px 10px;min-height:38px;font-size:.84rem;font-weight:700;background:var(--paper);color:var(--ink)}
.map{display:block;width:100%;height:auto;border-radius:10px;background:var(--night)}
.map .stop{cursor:pointer}.map .stop:focus{outline:none}.map .stop:focus>g,.map .stop:hover>g{filter:brightness(1.12)}.map .stop.locked{cursor:not-allowed;opacity:.62}
.map .pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.14);opacity:.35}}
.map .flow{animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-56}}
.map .wave{animation:wave 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wave{50%{transform:scale(1.3);opacity:.3}}
.map .needle{animation:needle 5s ease-in-out infinite}@keyframes needle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.map .herd{animation:herd 34s linear infinite alternate}@keyframes herd{from{transform:translate(110px,430px)}to{transform:translate(520px,540px)}}
.map .herd.slow{animation:herdt 42s linear infinite alternate}@keyframes herdt{from{transform:translate(90px,330px)}to{transform:translate(280px,420px)}}
.map .train{animation:train 18s linear infinite}@keyframes train{from{transform:translate(-60px,93px)}to{transform:translate(1240px,93px)}}
.map .cloud{animation:cloud 44s linear infinite}@keyframes cloud{from{transform:translate(-80px,240px)}to{transform:translate(1260px,170px)}}
.map .flag{animation:flagw 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes flagw{50%{transform:scaleX(.72)}}
.map .bob{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}

.bookpage{background:#fbf8ef;color:#1c1712;border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0;font-family:Georgia,"Times New Roman",serif;box-shadow:0 2px 0 #d8d2c0,0 4px 0 #efeadb,0 8px 22px rgba(0,0,0,.4)}
.bookpage .bh{display:flex;justify-content:space-between;gap:10px;font-style:italic;color:#47413a;font-size:.95rem;border-bottom:1px solid #c8c2b2;padding-bottom:4px}
.bookpage .bh i{font-size:.82rem;color:#6f685d}
.bookpage .sect{font-family:var(--body);font-weight:800;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;color:#1c5a8f;border-bottom:3px solid #1c5a8f;padding-bottom:3px}
.bookpage .prompt{font-family:Georgia,"Times New Roman",serif;font-weight:400;text-align:left;font-size:clamp(1.1rem,3.8vw,1.35rem);line-height:1.45}
.bookpage .answer{background:#fff;color:#1c5a8f;border-color:#1c1712}
.bookpage .answer .empty{color:#8b8474}
.bookpage .pad button{background:#30352f;color:#fff;font-family:var(--body);box-shadow:0 4px 0 #101310}
.bookpage .actions .btn,.bookpage>.btn,.bookpage .helper .btn{font-family:var(--body)}
.bookpage .btn.dark{background:#30352f;color:#fff;box-shadow:0 4px 0 #101310}
.bookpage .choices button{background:#fff;color:#1c1712;border:2px solid #1c1712;box-shadow:0 3px 0 #1c1712;font-family:var(--body)}
.bookpage .choices button[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.console .choices button[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.link.dk{color:#47413a;font-family:var(--body);font-size:.95rem}
.tag.dk{color:#6f685d;font-family:var(--body)}
.pgrid{display:grid;gap:4px}
.pgrid.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pcell{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;text-align:left;padding:10px 8px;color:inherit;border-radius:6px;font:inherit;align-items:start;min-height:64px;border:2px solid transparent;background:transparent}
.pcell:hover,.pcell:focus-visible{background:#fff0c4;border-color:#d9a441}
.pcell.pdone{background:#e8f4e4}
.pcell.pflag{background:#fde4d9}
.pnum{display:grid;justify-items:end;line-height:1.1;font-size:1.05rem}.pnum i{font-size:.72rem;color:#6f685d}
.pbody{font-size:1.08rem;line-height:1.4;min-width:0}
.pmath .pbody{font-size:1.35rem;font-variant-numeric:lining-nums tabular-nums}
.pans{display:block;font-style:normal;font-weight:700;color:#17663a}
.stamp{position:absolute;right:6px;bottom:6px;font-family:var(--display);font-size:.72rem;color:#17663a;border:2px solid #17663a;border-radius:4px;padding:0 5px;transform:rotate(8deg);background:#fbf8ef}
.pmathbig{text-align:center;font-size:clamp(2rem,8vw,3rem);padding:8px 0 4px;font-variant-numeric:lining-nums tabular-nums;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em}
.dv{display:inline-grid;justify-items:end}.dvq{min-height:1.15em;font-weight:700;color:#1c5a8f;padding-right:.05em}
.dvl{display:inline-flex;align-items:flex-start}.dvl>span:first-child{padding-right:.1em}
.dvb{border-top:.09em solid currentColor;border-left:.09em solid currentColor;border-top-left-radius:.5em 1em;padding:0 .08em 0 .28em}
.fr{display:inline-grid;justify-items:center;line-height:1.1}.frb{height:.08em;background:currentColor;width:100%;margin:.08em 0}
.eq{color:#47413a}
.slot{display:inline-block;min-width:1.2em;font-weight:700;color:#1c5a8f;text-align:center}.slot.open{color:#a9a294;border-bottom:.06em dashed #a9a294}
.move{font-family:var(--display);font-size:1.3rem;text-align:center;color:#b4411a}
.ctx.lt{background:#f1ead7;color:#1c1712;font-family:var(--body)}
.helper{display:grid;gap:10px;font-family:var(--body);background:#fff4d8;border-radius:8px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:center}.chips b{background:#1c5a8f;color:#fff;border-radius:6px;padding:4px 10px;font-size:1.15rem;font-variant-numeric:tabular-nums}.chips b.over{background:var(--red);text-decoration:line-through}
.fingers{display:flex;flex-wrap:wrap;gap:4px}.fingers i{width:14px;height:24px;border-radius:7px 7px 3px 3px;background:#e0ab7b;display:block}
.bookpage .boardwrap{background:#fff;border:1px solid #c8c2b2}.bookpage .vis{background:#fff;border:1px solid #c8c2b2;font-family:var(--body)}
.vert{display:inline-grid;justify-items:end;line-height:1.2}.vb{border-bottom:.08em solid currentColor;padding-left:.3em;min-width:100%;text-align:right}
.pmath .vert .vb{min-width:4em}
.pzboard{display:block;width:100%;max-width:440px;margin:0 auto;border-radius:8px}.pzwon{animation:pop .4s ease-out;transform-box:fill-box;transform-origin:center}
.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.big-tool{min-height:84px;min-width:140px;font-size:1.4rem}
.arrows{display:grid;justify-items:center;gap:4px}.arrows>div{display:flex;gap:44px}.arrows .btn{min-width:56px;min-height:48px;padding:6px 10px;font-size:1.1rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:grid;gap:10px}.match button{background:var(--panel2);color:var(--moon);font-family:var(--body);font-weight:800;min-height:64px;font-size:1.1rem;box-shadow:0 4px 0 #15183a}.match button.sel{background:var(--gold);color:var(--ink)}.match button.ok{background:var(--green);color:var(--ink);box-shadow:none}
.askbar{display:grid;gap:8px}.mic-btn{background:var(--ember);color:var(--ink);font-weight:800;min-height:52px;font-size:1.05rem;box-shadow:0 4px 0 #a54a1d}.mic-btn.on{background:var(--red);animation:pulse 1s ease-in-out infinite}
.askchips{display:flex;flex-wrap:wrap;gap:8px}.askchips button{background:var(--panel2);color:var(--moon);font-size:.92rem;font-weight:600;padding:8px 12px;min-height:44px;border-radius:999px}
.heard{font-size:.9rem;color:var(--moon-soft);font-style:italic}
#topbar{display:grid;gap:8px;min-width:0}#topbar:empty{display:none}
.left,.right{display:contents}
.bubtns{display:grid;gap:2px;justify-items:end}.again{font-size:.82rem;font-weight:800;color:#fff;background:#8a5a2b;border-radius:8px;padding:8px 10px;min-height:40px;white-space:nowrap}
.skipbtn{min-height:48px;font-size:.95rem}
.scene{cursor:pointer}
@media (orientation:landscape) and (min-width:800px){
  body{padding-block:6px 6px}
  #shell{max-width:1320px;gap:8px}
  #app{gap:8px}
  body[data-view="ride"] #shell{grid-template-columns:minmax(0,1fr) minmax(0,280px);align-items:start}
  body[data-view="ride"] #topbar{grid-column:1;grid-row:1}
  body[data-view="ride"] #world{grid-column:2;grid-row:1}
  body[data-view="ride"] #app{grid-column:1/-1}
  body[data-view="ride"] #world{width:100%}
  .biscuit{min-height:0;padding:6px 10px;grid-template-columns:40px minmax(0,1fr) auto;font-size:.95rem}.biscuit svg{width:36px;height:36px}
  .bubtns{grid-auto-flow:column;gap:6px;align-items:center}
  .hud .btn.small{min-height:38px;padding:4px 12px}
  .hud .btn.small.mapbtn{min-height:50px;padding:6px 26px;font-size:1.15rem}

<script>

// Keep hash() and norm() identical to the copies in tools/build-lessons.mjs.
function hash(str, seed = 0) {

  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);

const seal = (lessonId, itemId, value) => hash(`${lessonId}|${itemId}|${norm(value)}`);

/* ---------- saved progress ---------- */

}
async function connect() {

}

      S = { ...blank(), ...remote };
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}

}
// Saves from older versions can be missing fields, so fill them in place.
const LP = (id) => {
  const lp = (S.lessons[id] = S.lessons[id] || {});
  lp.completed = !!lp.completed; lp.problems = lp.problems || {}; lp.rides = lp.rides || {}; lp.drawBest = lp.drawBest ?? null;
  return lp;
};
const PP = (lp, id) => {
  const p = (lp.problems[id] = lp.problems[id] || {});
  p.done = !!p.done; p.firstTry = !!p.firstTry; p.wrong = p.wrong || []; p.coached = !!p.coached; p.steps = p.steps || 0; p.flagged = !!p.flagged; p.accepted = !!p.accepted;
  return p;
};

/* ---------- ranks ---------- */
const RANKS = [["Greenhorn", 0], ["Trail Hand", 300], ["Deputy", 800], ["Sheriff", 1600], ["Marshal", 3000], ["Legend of the West", 5000]];
const rankOf = (xp) => { let i = 0; RANKS.forEach((r, n) => { if (xp >= r[1]) i = n; }); return i; };
function earn(n) {
  const before = rankOf(S.xp);
  S.nuggets += n; S.xp += n;
  const after = rankOf(S.xp);
  if (after > before) { banner(`Rank up: ${RANKS[after][0]}!`); confetti(40); beep(FANFARE); }
}
function rankHud() {
  const i = rankOf(S.xp), next = RANKS[i + 1], from = RANKS[i][1];
  const pct = next ? Math.round(((S.xp - from) / (next[1] - from)) * 100) : 100;
  return `<div class="rank"><span>${RANKS[i][0]}</span><div class="xp" aria-label="${pct} percent to next rank"><i style="width:${pct}%"></i></div></div>`;

/* ---------- sound and voice ---------- */

}
const CHIME = [[523, 0, .09], [659, .08, .09], [784, .16, .18]], BLIP = [[880, 0, .07]], NOPE = [[170, 0, .16, "sawtooth"]], THUD = [[100, 0, .15, "triangle"]], BANG = [[80, 0, .25, "sawtooth"], [50, .04, .3, "sawtooth"]];

function startMusic() {
  stopMusic();
  const bass = [147, 147, 220, 147, 196, 147, 175, 165]; let i = 0;
  music = setInterval(() => { beep([[bass[i % 8], 0, .14, "triangle"], ...(i % 2 ? [[bass[i % 8] * 3, 0, .05]] : [])]); i++; }, 210);
}
function stopMusic() { clearInterval(music); music = 0; }
let lastSaid = "", sayText = "", sayIdx = -1, sayTimer = 0;
const wordsHtml = (t) => String(t).split(/\s+/).map((w) => `<span class="w">${esc(w)}</span>`).join(" ");
function markWord() {
  document.querySelectorAll("[data-say]").forEach((el) => {
    const on = el.dataset.say === sayText;
    el.querySelectorAll(".w").forEach((w, i) => w.classList.toggle("on", on && i === sayIdx));
  });
}
function endWords() { clearInterval(sayTimer); sayIdx = -1; markWord(); document.body.classList.remove("talking"); }
function followWords(t) {
  clearInterval(sayTimer); sayText = t; sayIdx = 0; markWord(); document.body.classList.add("talking");
  const parts = t.split(/\s+/);
  const nextWord = () => {
    sayIdx++;
    if (sayIdx >= parts.length) return endWords();
    markWord();
    clearInterval(sayTimer);
    sayTimer = setInterval(nextWord, 170 + parts[sayIdx].length * 58);
  };
  sayTimer = setInterval(nextWord, 170 + parts[0].length * 58);
}
function speak(t, force) {
  if (!t || (t === lastSaid && !force)) return;
  lastSaid = t;
  try {
    if (!force && (S.voice === false || S.muted)) return;
    followWords(t);
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/×/g, " times ").replace(/÷/g, " divided by ").replace(/−/g, " minus ").replace(/√/g, " the square root of "));

  const fx = document.getElementById("fx"), cols = ["#ffc42e", "#ff7a3c", "#39d07a", "#f2f3ff", "#ff5a4f"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("i");
    el.style.left = "50%"; el.style.background = pick(cols);

function dancer() {

  return `<svg viewBox="0 0 160 270" class="dancer ${pick(["d-hop", "d-spin", "d-siu"])}" aria-hidden="true">

      <path d="M57 52c-3-16 8-26 23-26s26 10 23 26c-4-7-12-10-23-10s-19 3-23 10z" fill="#f2d262"/>
      <circle cx="71" cy="56" r="3" fill="#27354f"/><circle cx="89" cy="56" r="3" fill="#27354f"/><path d="M68 65c6 7 18 7 24 0" fill="#fff" stroke="#8b4a31" stroke-width="2"/>

function fireworks(cv, big) {

function coinPop() {

  setTimeout(() => b.remove(), 650); beep([[1568, 0, .05]]);
}
function banner(t) { const b = document.createElement("div"); b.className = "banner pop"; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 2200); }

/* ---------- the game world ---------- */
const canvas = document.getElementById("world"), ctx = canvas.getContext("2d");

addEventListener("resize", () => worldSize(W.H));
function worldBoost(msg) { W.boost = 50; W.shake = 8; if (msg) { W.text = msg; W.textT = 55; } for (let i = 0; i < 14; i++) W.dust.push({ x: 130, y: W.H - 28, vx: -2 - Math.random() * 5, vy: -Math.random() * 3, a: 1 }); }
function drawSky() {
  const H = W.H, c = ctx;

    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#141a44"); g.addColorStop(.55, "#2a3a7a"); g.addColorStop(.56, "#2f9f5c"); g.addColorStop(1, "#1f7d45");
    c.fillStyle = g; c.fillRect(0, 0, 720, H);

    [120, 360, 600].forEach((x) => { c.fillStyle = "#e8ecff"; c.fillRect(x - 2, 6, 4, H * .26); const gl = c.createRadialGradient(x, 10, 2, x, 10, 46); gl.addColorStop(0, "rgba(255,255,255,.95)"); gl.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = gl; c.fillRect(x - 46, -36, 92, 92); });

    for (let i = 0; i < 8; i++) { const x = ((i * 130 - W.scroll) % 1040 + 1040) % 1040 - 100; c.beginPath(); c.moveTo(x, H * .58); c.lineTo(x - 60, H); c.stroke(); }
    return;

/* ---------- parents ---------- */
function statusOf(p) {
  if (p.accepted) return ["Parent accepted", "s-good"];
  if (p.paper) return ["Check his drawing", "s-work"];
  if (p.shaky) return ["Go over this together", "s-stuck"];
  if (p.done && p.firstTry) return ["Solo, first try", "s-good"];
  if (p.done && p.proved) return ["Coached, then proved it", "s-good"];
  if (p.done && p.coached) return ["Solved with coaching", "s-work"];
  if (p.done) return ["Fixed his own mistake", "s-work"];
  if (p.flagged) return ["Needs a parent", "s-stuck"];
  if (p.wrong.length || p.steps) return ["Working on it", "s-work"];
  return ["Not started", "s-none"];
}
const fmtTime = (secs) => (!secs ? "" : secs < 60 ? "under 1 min" : `${Math.round(secs / 60)} min`);
function reportText() {
  const out = [`Elliot's math work, ${new Date().toLocaleDateString()}`, `Rank: ${RANKS[rankOf(S.xp)][0]}`];
  LESSONS.forEach((l) => {
    const lp = LP(l.id), touched = l.problems.filter((q) => { const p = PP(lp, q.id); return p.done || p.wrong.length || p.steps || p.flagged; });
    if (!touched.length && !lp.factsResult) return;
    const done = l.problems.filter((q) => PP(lp, q.id).done).length;
    const review = touched.filter((q) => { const p = PP(lp, q.id); return p.shaky || p.flagged || p.paper; });
    out.push("", `SAXON LESSON ${l.bookLesson}: ${done} of ${l.problems.length} problems done`);
    if (lp.factsResult) out.push(`100 facts: ${lp.factsResult.miss} misses, ${fmtTime(lp.factsResult.secs)}`);
    if (review.length) out.push(`Go over together: ${review.map((q) => q.id).join(", ")}`);
    touched.forEach((q) => {
      const p = PP(lp, q.id), bits = [statusOf(p)[0]];
      if (p.wrong.length) bits.push(`wrong tries: ${p.wrong.join(", ")}`);
      if (p.steps) bits.push(`${p.steps} coaching step${p.steps === 1 ? "" : "s"}`);
      if (p.stepMiss) bits.push(`${p.stepMiss} missed step${p.stepMiss === 1 ? "" : "s"}`);
      if (p.secs) bits.push(fmtTime(p.secs));
      out.push(`#${q.id} ${q.skill}: ${bits.join("; ")}`);
    });
  });
  if (out.length === 2) out.push("", "Nothing done yet.");
  return out.join("\n");
}

  kickTimer = setInterval(() => {

    kick.t += .055; kick.x = 180 + 105 * Math.sin(kick.t * (1 + kick.shots.length * .18));

function shoot() {
  if (!kick || kick.phase !== "aim") return;

const ENTRY = ".pad,.actions,.helper,.choices,.tools,.sort,.match,.answer,.btn,.link,.call,.score";
// Keeps the problem on the left and the things he taps on the right when the iPad is sideways.
function initScratch() {
  const cv = document.getElementById("spad"); if (!cv) return;
  const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const c = cv.getContext("2d");
  const seg = (t, a, b) => {
    c.globalCompositeOperation = t === "erase" ? "destination-out" : "source-over";
    c.strokeStyle = "#1c1712"; c.lineWidth = (t === "erase" ? 26 : 4) * dpr; c.lineCap = "round"; c.lineJoin = "round";
    c.beginPath(); c.moveTo(a[0] * cv.width, a[1] * cv.width); c.lineTo(b[0] * cv.width, b[1] * cv.width); c.stroke();
  };
  (U.strokes || []).forEach((st) => st.p.forEach((pt, i) => seg(st.t, st.p[Math.max(0, i - 1)], pt)));
  let cur = null;
  const at = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.width]; };
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); cv.setPointerCapture?.(e.pointerId); cur = { t: U.spTool === "erase" ? "erase" : "pen", p: [at(e)] }; (U.strokes = U.strokes || []).push(cur); seg(cur.t, cur.p[0], cur.p[0]); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; e.preventDefault(); const p = at(e), last = cur.p[cur.p.length - 1]; cur.p.push(p); seg(cur.t, last, p); });
  const end = () => { if (cur) save(); cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}
function arrange() {

  const top = document.getElementById("topbar"); top.innerHTML = "";
  if (U.view === "ride") {
    [...app.children].filter((el) => el.matches(".hud,.biscuit,.askbar")).forEach((el) => top.appendChild(el));
    const hud = top.querySelector(".hud"), status = hud ? [...hud.children].filter((el) => el.matches(".pips,.chip:not(.nug),.combo")) : [];
    if (status.length) { let bar = top.querySelector(".askbar"); if (!bar) { bar = document.createElement("div"); bar.className = "askbar"; top.appendChild(bar); } bar.prepend(...status); }
  }
  if (U.view !== "ride") return;
  app.querySelectorAll(":scope > .bookpage, :scope > .console:not(.boardbox)").forEach((box) => {
    const kids = [...box.children];
    if (!kids.some((k) => k.matches(ENTRY.replace(",.btn,.link", "") + ",.boardwrap,.scene"))) return;
    if (kids.every((k) => k.matches(ENTRY))) { box.classList.add("centered"); return; }
    const left = document.createElement("div"), right = document.createElement("div");
    left.className = "left"; right.className = "right";
    kids.forEach((k) => (k.matches(ENTRY) ? right : left).appendChild(k));
    box.classList.add("split"); box.append(left, right);
    const pad = left.querySelector(":scope > .scratch");

}
